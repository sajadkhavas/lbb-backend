name: P4 temporary Pint fix

on:
  push:
    branches:
      - phase/lbb-p4-commerce-go-live
    paths:
      - .github/workflows/p4-pint-fix.yml

permissions:
  contents: write

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/lbb-p4-commerce-go-live
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply Pint and remove helper
        run: |
          vendor/bin/pint app/Filament/Resources/DeliveryZoneResource.php app/Services/Store/DeliveryConfigurationService.php
          rm .github/workflows/p4-pint-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(p4): apply Pint to commerce delta [p4-pint]'
          git push origin HEAD:phase/lbb-p4-commerce-go-live
