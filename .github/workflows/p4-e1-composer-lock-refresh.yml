name: P4 E1 Composer Lock Refresh

on:
  push:
    branches:
      - fix/p4-seo-e1-ssr-rate-limit
    paths:
      - .github/workflows/p4-e1-composer-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/p4-seo-e1-ssr-rate-limit
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Refresh only Laravel Excel security patch
        run: |
          composer update maatwebsite/excel \
            --with-dependencies \
            --minimal-changes \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --no-scripts
          composer show maatwebsite/excel | grep -E '^versions[[:space:]]*:'
          composer audit --locked --abandoned=report

      - name: Commit deterministic lock refresh
        run: |
          test -n "$(git status --porcelain -- composer.lock)"
          git diff -- composer.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'security: refresh Laravel Excel to patched release'
          git push origin HEAD:fix/p4-seo-e1-ssr-rate-limit
