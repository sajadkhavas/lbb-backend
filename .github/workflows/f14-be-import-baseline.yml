name: F14-BE Import Backend Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - phase/f14-be-a-backend-foundation
    paths:
      - .github/workflows/f14-be-import-baseline.yml

permissions:
  contents: write

concurrency:
  group: f14-be-import-backend-baseline
  cancel-in-progress: false

jobs:
  import:
    name: Import audited Laravel baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout LBB backend branch
        uses: actions/checkout@v4
        with:
          ref: phase/f14-be-a-backend-foundation
          fetch-depth: 0

      - name: Checkout read-only Winimi baseline
        uses: actions/checkout@v4
        with:
          repository: sajadkhavas/winimi-bakery-backend
          ref: 40ae2ccb4e10775bbff0b724f2994d5ec90f7c1b
          path: .source-winimi
          fetch-depth: 1

      - name: Copy tracked application source safely
        shell: bash
        run: |
          set -Eeuo pipefail
          rsync -a \
            --exclude='.git' \
            --exclude='.github/workflows' \
            --exclude='README.md' \
            --exclude='.env' \
            --exclude='*.sqlite' \
            --exclude='storage/app/public' \
            .source-winimi/ ./

          mkdir -p docs/reference
          cp .source-winimi/README.md docs/reference/WINIMI_BASELINE_README.md

          cat > README.md <<'MARKDOWN'
          # LBB Backend

          Independent Laravel 12 + Filament backend for the LBB apparel commerce platform.

          ## Safety boundary

          - `sajadkhavas/cooci` is read-only reference material.
          - `sajadkhavas/winimi-bakery-backend` is read-only reference material.
          - All LBB backend changes happen only in this repository.
          - No production secrets, customer data, orders, payments, media, or environment files are copied.

          ## Imported baseline

          Source repository: `sajadkhavas/winimi-bakery-backend`

          Frozen source commit: `40ae2ccb4e10775bbff0b724f2994d5ec90f7c1b`

          The imported source is a technical baseline only. Winimi, Bakery, food-specific and legacy ToolMaster code must not be treated as LBB production behavior and will be removed in the following F14-BE stages.
          MARKDOWN

          cat > .env.example <<'ENV'
          APP_NAME="LBB"
          APP_ENV=local
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          APP_LOCALE=fa
          APP_FALLBACK_LOCALE=fa
          APP_TIMEZONE=Asia/Tehran

          LOG_CHANNEL=stack
          LOG_LEVEL=debug

          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=lbb
          DB_USERNAME=lbb
          DB_PASSWORD=

          CACHE_STORE=database
          QUEUE_CONNECTION=database
          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_SECURE_COOKIE=false
          SESSION_HTTP_ONLY=true
          SESSION_SAME_SITE=lax
          SESSION_ENCRYPT=true

          FRONTEND_URL=http://localhost:3000
          FRONTEND_URLS=http://localhost:3000
          SANCTUM_STATEFUL_DOMAINS=localhost:3000

          FILESYSTEM_DISK=public
          LEGACY_TOOLMASTER_API_ENABLED=false
          SEED_WINIMI_STAGING=false

          CHECKOUT_ENABLED=false
          PAYMENT_ENABLED=false
          PAYMENT_PROVIDER=disabled
          ZARINPAL_MERCHANT_ID=
          PAYMENT_CALLBACK_URL=http://localhost:3000/payment/callback

          SMS_PROVIDER=disabled
          ORDER_SMS_PROVIDER=disabled
          OTP_EXPOSE_TEST_CODE=false
          KAVENEGAR_API_KEY=
          KAVENEGAR_TEMPLATE=

          ENAMAD_ENABLED=false
          ENAMAD_BADGE_CODE=

          TELESCOPE_ENABLED=false
          PULSE_ENABLED=false

          BACKUP_DISK=local
          BACKUP_RETENTION_DAYS=14
          BACKUP_ENCRYPTION_PASSWORD=
          ENV

          cat > docs/F14_BE_BASELINE.md <<'MARKDOWN'
          # F14-BE Backend Baseline

          ## Source lock

          - Source: `sajadkhavas/winimi-bakery-backend`
          - Commit: `40ae2ccb4e10775bbff0b724f2994d5ec90f7c1b`
          - Imported into: `sajadkhavas/lbb-backend`
          - Working branch: `phase/f14-be-a-backend-foundation`

          ## Import exclusions

          - Source Git history and `.git`
          - Source GitHub Actions workflows
          - Real `.env` files
          - SQLite databases
          - Runtime public media
          - Customer, order, payment and production runtime data

          ## Mandatory next stages

          1. Remove Winimi/Bakery identity and food-specific behavior.
          2. Remove the legacy ToolMaster compatibility API.
          3. Introduce apparel categories, collections, colors, sizes and variants.
          4. Rebuild Filament resources for LBB apparel operations.
          5. Freeze an LBB-specific API contract before frontend integration.
          MARKDOWN

          rm -rf .source-winimi
          rm -f .github/workflows/f14-be-import-baseline.yml

      - name: Audit forbidden runtime files
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -f .env
          if find . -path './.git' -prune -o \( -name '*.sqlite' -o -name '*.pem' -o -name '*.key' \) -print | grep -q .; then
            echo 'Forbidden runtime or secret-like file was imported.' >&2
            find . -path './.git' -prune -o \( -name '*.sqlite' -o -name '*.pem' -o -name '*.key' \) -print
            exit 1
          fi
          if find .github/workflows -type f ! -name 'f14-be-import-baseline.yml' -print 2>/dev/null | grep -q .; then
            echo 'Source workflows were imported unexpectedly.' >&2
            exit 1
          fi

      - name: Validate Composer metadata
        run: composer validate --no-interaction --no-check-publish

      - name: Commit imported baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No baseline changes to commit.'
            exit 0
          fi
          git commit -m 'F14-BE-A: import audited Laravel backend baseline'
          git push origin HEAD:phase/f14-be-a-backend-foundation
