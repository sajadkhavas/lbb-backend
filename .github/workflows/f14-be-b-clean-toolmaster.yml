name: F14-BE-B Remove ToolMaster Legacy

on:
  push:
    branches:
      - phase/f14-be-b-domain-cleanup
    paths:
      - .github/workflows/f14-be-b-clean-toolmaster.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f14-be-b-clean-toolmaster
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/f14-be-b-domain-cleanup
          fetch-depth: 0

      - name: Remove inherited ToolMaster domain
        run: python3 scripts/f14_be_b_cleanup.py

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find app bootstrap config database routes scripts tests -type f -name '*.php' -print0)

      - name: Validate Composer metadata
        run: composer validate --no-check-lock --no-check-publish --no-interaction

      - name: Install locked PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-redis

      - name: Prepare test environment
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .env.example .env
          mkdir -p database storage/framework/sessions storage/framework/cache storage/framework/views
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan optimize:clear

      - name: Run LBB foundation checks
        run: |
          php scripts/audit-lbb-foundation.php
          php artisan route:list --except-vendor

      - name: Commit B1 cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/f14-be-b-clean-toolmaster.yml
          rm -f scripts/f14_be_b_cleanup.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'F14-BE-B: remove ToolMaster and Winimi runtime inheritance'
          git push origin HEAD:phase/f14-be-b-domain-cleanup
