name: F14-BE-B Test Diagnostics

on:
  push:
    branches:
      - phase/f14-be-b-domain-cleanup
    paths:
      - .github/workflows/f14-be-b-test-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/f14-be-b-domain-cleanup
          fetch-depth: 0

      - name: Build focused diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          report='docs/F14_BE_B_TEST_DIAGNOSTICS.md'
          mkdir -p docs
          {
            echo '# F14-BE-B Test Diagnostics'
            echo
            echo '## Matching test paths'
            echo '```text'
            grep -RIl -E 'class (BakeryGalleryOverviewApiTest|OrderCheckoutTest|AuthenticationLogRedactionTest|BakeryCatalogApiTest)' tests 2>/dev/null | sort || true
            echo '```'
            echo
            echo '## Related runtime paths'
            echo '```text'
            grep -RIl -E 'gallery/overview|class Gallery|class CheckoutService|path_url|weight_grams|requires_cooling|allergens|ingredients' app database routes tests 2>/dev/null | sort || true
            echo '```'

            for pattern in \
              'class BakeryGalleryOverviewApiTest' \
              'class OrderCheckoutTest' \
              'class AuthenticationLogRedactionTest' \
              'class BakeryCatalogApiTest'
            do
              while IFS= read -r file; do
                [ -n "$file" ] || continue
                echo
                echo "## File: \`$file\`"
                echo '```php'
                sed -n '1,320p' "$file"
                echo '```'
              done < <(grep -RIl -F "$pattern" tests 2>/dev/null | sort || true)
            done

            for file in \
              app/Services/Orders/CheckoutService.php \
              app/Http/Controllers/Api/CatalogController.php \
              app/Http/Controllers/Api/GalleryController.php \
              app/Http/Resources/GalleryItemResource.php \
              app/Http/Resources/ProductResource.php \
              app/Http/Resources/ProductVariantResource.php \
              app/Models/Product.php \
              app/Models/ProductVariant.php
            do
              if [ -f "$file" ]; then
                echo
                echo "## File: \`$file\`"
                echo '```php'
                sed -n '1,360p' "$file"
                echo '```'
              fi
            done
          } > "$report"

          rm -f .github/workflows/f14-be-b-test-diagnostics.yml

      - name: Commit diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'F14-BE-B: record focused test diagnostics'
          git push origin HEAD:phase/f14-be-b-domain-cleanup
