name: P2 Dependency Security Refresh Helper

on:
  push:
    branches:
      - phase/p2-backend-final-audit-release-freeze

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost,127.0.0.1
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/p2-backend-final-audit-release-freeze
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, curl, openssl, bcmath, pdo_sqlite, sqlite3, fileinfo
          coverage: none

      - name: Refresh vulnerable packages with bounded dependency updates
        shell: bash
        run: |
          composer update league/commonmark livewire/livewire --with-dependencies --no-interaction --prefer-dist --no-progress
          composer validate --strict
          composer audit --locked --abandoned=report
          composer show league/commonmark
          composer show livewire/livewire

          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files after security refresh:\n%s\n' "${changed[*]}"
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "composer.lock" ]; then
            echo 'Security refresh must be lock-only.'
            git diff -- composer.json composer.lock || true
            exit 1
          fi

      - name: Compatibility smoke after lock refresh
        shell: bash
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate:fresh --force
          php artisan backend:readiness --json
          php artisan test tests/Feature/BackendFinalAcceptanceTest.php tests/Feature/BackendContractFreezeTest.php tests/Feature/CommerceFilamentTest.php tests/Feature/CustomerOtpAuthTest.php tests/Feature/WebPushSubscriptionTest.php

      - name: Commit audited lock refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git diff --cached --quiet && exit 0
          git commit -m "fix(security): refresh vulnerable Composer lock packages"
          git push origin HEAD:phase/p2-backend-final-audit-release-freeze
