name: One-shot admin filter callback hotfix

on:
  push:
    branches:
      - hotfix/admin-filter-callback-20260910

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/admin-filter-callback-20260910
          fetch-depth: 0

      - name: Replace unsafe Collection filter callbacks
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          paths = [
              Path('app/Filament/Pages/StorefrontControlCenter.php'),
              Path('app/Filament/Pages/SiteSettings.php'),
          ]
          needle = "->filter('is_array')"
          replacement = "->filter(fn ($value): bool => is_array($value))"

          before = 0
          for path in paths:
              text = path.read_text()
              count = text.count(needle)
              print(f'{path}: unsafe_before={count}')
              before += count
              path.write_text(text.replace(needle, replacement))

          if before != 9:
              raise SystemExit(f'expected exactly 9 unsafe callbacks, found {before}')

          after = sum(path.read_text().count(needle) for path in paths)
          print(f'unsafe_after={after}')
          if after != 0:
              raise SystemExit('unsafe callbacks remain')
          PY

          php -l app/Filament/Pages/StorefrontControlCenter.php
          php -l app/Filament/Pages/SiteSettings.php

          if grep -RFn --include='*.php' -e "filter('is_array')" -e 'filter("is_array")' app; then
            echo 'unsafe is_array Collection callbacks remain under app/' >&2
            exit 1
          fi

      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/hotfix-admin-filter-callback.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Filament/Pages/StorefrontControlCenter.php app/Filament/Pages/SiteSettings.php
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: use unary callbacks for admin array filters'
          git push origin HEAD:hotfix/admin-filter-callback-20260910
