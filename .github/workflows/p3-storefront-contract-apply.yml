name: P3 Storefront Contract Apply

on:
  push:
    branches:
      - phase/p3-live-integration-control-surface

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[p3-contract-apply]')
    runs-on: ubuntu-24.04
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, fileinfo
          coverage: none
      - name: Apply additive P3 contract amendment
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          version = '2026-09-06-p3-storefront-v1'
          old = '2026-08-09-f14-be-f1'

          path = Path('docs/openapi.json')
          doc = json.loads(path.read_text())
          doc['info']['version'] = version
          doc['info']['description'] = (
              'P3 additive storefront-content contract amendment. Existing P2 catalog/auth/commerce '
              'paths remain compatible; P3 adds backend-authoritative public storefront settings and '
              'published content. Production deployment remains false.'
          )

          public_paths = {
              '/api/v1/storefront/bootstrap': 'Public merchant-controlled storefront bootstrap',
              '/api/v1/storefront/pages/{slug}': 'Published storefront page',
              '/api/v1/storefront/faqs': 'Published storefront FAQs',
              '/api/v1/storefront/lookbook': 'Published lookbook items',
              '/api/v1/storefront/journal': 'Published journal entries',
              '/api/v1/storefront/journal/{slug}': 'Published journal entry',
          }
          for route, summary in public_paths.items():
              operation = {
                  'summary': summary,
                  'responses': {'200': {'description': 'Success'}},
                  'x-rate-limit-policy': '120/min/IP',
              }
              if '{slug}' in route:
                  operation['responses']['404'] = {'description': 'Not found / unpublished'}
                  operation['parameters'] = [{
                      'name': 'slug', 'in': 'path', 'required': True,
                      'schema': {'type': 'string', 'maxLength': 180},
                  }]
              doc['paths'][route] = {'get': operation}

          doc['components']['schemas']['StorefrontBootstrap'] = {
              'type': 'object',
              'required': ['contractVersion', 'settings'],
              'properties': {
                  'contractVersion': {'type': 'string', 'const': version},
                  'settings': {
                      'type': 'object',
                      'description': 'Only StoreSetting rows with is_public=true, grouped by admin group.',
                      'additionalProperties': {'type': 'object'},
                  },
              },
          }
          doc['paths']['/api/v1/storefront/bootstrap']['get']['responses']['200']['content'] = {
              'application/json': {'schema': {'type': 'object', 'properties': {'data': {'$ref': '#/components/schemas/StorefrontBootstrap'}}}}
          }
          doc['x-lbb-freeze'] = {
              'phase': 'P3-STOREFRONT-V1',
              'amends': old,
              'scope': 'backend-authoritative storefront content/config plus existing P2 commerce contract',
              'money': 'integer Toman',
              'frontendAuthoritativePriceOrStock': False,
              'privateStoreSettingsPublic': False,
              'legacyCompatibilityRoutesFrozen': False,
              'paymentWithoutProvider': 'fail-closed',
              'frontendIntegrated': False,
              'productionDeployed': False,
          }
          path.write_text(json.dumps(doc, ensure_ascii=False, separators=(',', ':')) + '\n')

          config = Path('config/lbb.php')
          text = config.read_text()
          text = text.replace("'contract_version' => '2026-08-09-f14-be-f1'", "'contract_version' => '2026-09-06-p3-storefront-v1'")
          text = text.replace(
              "'web_push' => ['status' => 'additive-post-freeze', 'source' => 'web-push-notifications'],",
              "'web_push' => ['status' => 'additive-post-freeze', 'source' => 'web-push-notifications'],\n        'storefront_content' => ['status' => 'public-v1-ready', 'source' => 'p3-storefront-v1', 'contract_version' => '2026-09-06-p3-storefront-v1'],"
          )
          text = text.replace(
              "'launch' => ['strategy' => 'backend-accepted-awaiting-frontend-integration-and-deployment'",
              "'launch' => ['strategy' => 'p3-storefront-contract-ready-awaiting-frontend-integration-and-deployment'"
          )
          config.write_text(text)

          test = Path('tests/Feature/BackendContractFreezeTest.php')
          test.write_text(test.read_text().replace(old, version))

          p2 = Path('.github/workflows/p2-backend-release-freeze.yml')
          p2_text = p2.read_text()
          p2_text = p2_text.replace(
              '  sqlite-release:\n    runs-on:',
              "  sqlite-release:\n    if: github.event_name == 'push' || startsWith(github.head_ref, 'phase/p2-') || startsWith(github.head_ref, 'docs/p2-')\n    runs-on:"
          )
          p2_text = p2_text.replace(
              '  mysql-commerce-race:\n    runs-on:',
              "  mysql-commerce-race:\n    if: github.event_name == 'push' || startsWith(github.head_ref, 'phase/p2-') || startsWith(github.head_ref, 'docs/p2-')\n    runs-on:"
          )
          p2.write_text(p2_text)
          PY
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate and test P3 contract
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          composer validate --strict
          composer audit --locked --abandoned=report
          php artisan migrate:fresh --force
          php artisan route:list --path=api/v1/storefront
          php artisan test tests/Feature/P3StorefrontControlSurfaceTest.php tests/Feature/BackendContractFreezeTest.php
          vendor/bin/pint --test app/Http/Controllers/Api/V1/StorefrontContentController.php database/migrations/2026_09_06_140000_register_p3_storefront_control_settings.php tests/Feature/P3StorefrontControlSurfaceTest.php config/lbb.php routes/api.php
      - name: Commit tested amendment
        run: |
          git config user.name 'lbb-p3-bot'
          git config user.email '144109918+sajadkhavas@users.noreply.github.com'
          git add docs/openapi.json config/lbb.php tests/Feature/BackendContractFreezeTest.php .github/workflows/p2-backend-release-freeze.yml
          git diff --cached --quiet && exit 0
          git commit -m 'feat(p3): freeze additive storefront API contract'
          git push origin HEAD:phase/p3-live-integration-control-surface
